<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f3ed">
<title>my things.</title>
<style>
:root{--bg:#f7f3ed;--card:#fffdfa;--ink:#24221f;--muted:#8a8278;--line:#e5ddd2;--accent:#b66b52;--soft:#f1e6dc;--shadow:0 12px 34px rgba(45,36,28,.08)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:96px}
header{padding:24px 20px 8px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:25px;font-weight:850;letter-spacing:-1.4px}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.iconbtn{border:0;background:var(--card);width:48px;height:48px;border-radius:17px;font-size:28px;color:#3775df;box-shadow:var(--shadow)}
.hero{padding:16px 20px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);font-weight:700}
.hero h1{font-size:39px;line-height:.99;letter-spacing:-2.2px;margin:10px 0 12px}
.hero p{color:var(--muted);margin:0;font-size:15px;line-height:1.45}
.search{display:flex;gap:9px;margin-top:22px}
.search input{flex:1;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:15px 16px;font-size:16px;outline:none}
.search button{width:52px;border:0;border-radius:18px;background:var(--ink);color:white;font-size:23px}
.toolbar{display:flex;gap:8px;overflow:auto;padding:4px 20px 18px;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-size:13px;color:var(--ink)}
.chip.active{background:var(--ink);color:#fff}
section{padding:0 20px}
.sectionhead{display:flex;align-items:end;justify-content:space-between;margin:2px 0 12px}
.sectionhead h2{font-size:18px;margin:0}
.count{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.item{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.item.big{grid-column:span 2}
.pic{position:relative;height:178px;background:linear-gradient(135deg,#e8ded3,#f8f1e8);display:flex;align-items:center;justify-content:center;overflow:hidden}
.item.big .pic{height:280px}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .emoji{font-size:45px}
.item.big .pic .emoji{font-size:58px}
.scorepill{position:absolute;right:10px;top:10px;background:rgba(255,253,250,.94);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}
.body{padding:13px 14px 15px}
.name{font-weight:800;font-size:17px;line-height:1.12}
.item.big .name{font-size:21px}
.meta{font-size:11px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.ratingrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.rating{font-size:17px;font-weight:850}
.again{font-size:11px;background:var(--soft);padding:6px 9px;border-radius:999px;white-space:nowrap}
.note{font-size:13px;line-height:1.4;color:#575149;margin-top:10px}
.empty{padding:48px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:24px;grid-column:1/-1}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:rgba(255,253,249,.93);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:5}
.nav{border:0;background:none;color:var(--muted);font-size:10px;padding:3px 0}
.nav b{display:block;font-size:20px;margin-bottom:2px;color:var(--ink)}
.nav.active{color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(30,25,20,.44);display:none;align-items:flex-end;z-index:10}
.sheet{width:min(560px,100%);margin:auto;background:var(--card);border-radius:30px 30px 0 0;padding:12px 20px 24px;max-height:92vh;overflow:auto}
.grab{width:42px;height:4px;border-radius:99px;background:#d7cec4;margin:2px auto 16px}
.sheet h2{margin:0 0 18px;font-size:25px}
.row{margin:16px 0}
.row label{font-size:12px;color:var(--muted);display:block;margin-bottom:8px;font-weight:700}
.row input,.row textarea,.row select{width:100%;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff;font:inherit;outline:none}
.row textarea{min-height:88px}
.score{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.score button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 0}
.score button.sel{background:var(--ink);color:#fff}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.choices button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 4px;font-size:12px}
.choices button.sel{border-color:var(--accent);background:#f4e6dc}
.photo-preview{margin-top:9px;border-radius:16px;overflow:hidden;background:var(--soft);display:none}
.photo-preview img{width:100%;height:170px;object-fit:cover}
.notehint{font-size:11px;color:var(--muted);margin-top:6px}
.actions{display:flex;gap:8px;margin-top:20px}
.actions button{flex:1;border:0;border-radius:15px;padding:15px;font-weight:800}
.cancel{background:var(--soft)}
.save{background:var(--ink);color:#fff}
</style>
</head>
<body>

<div class="app">
<header>
<div><div class="brand">my things.</div><div class="sub">what I tried lately</div></div>
<button class="iconbtn" onclick="openModal()">＋</button>
</header>

<div class="hero">
<div class="eyebrow">my personal archive</div>
<h1>Your taste,<br>your archive.</h1>
<p>Denediğin her şeyi kendi zevkine göre kaydet.</p>
<div class="search">
<input id="search" placeholder="Bir şey ara..." oninput="render()">
<button onclick="openModal()">＋</button>
</div>
</div>

<div class="toolbar">
<button class="chip active" data-cat="all" onclick="setCat(this,'all')">Hepsi</button>
<button class="chip" data-cat="Beauty" onclick="setCat(this,'Beauty')">Beauty</button>
<button class="chip" data-cat="Food" onclick="setCat(this,'Food')">Food</button>
<button class="chip" data-cat="Drinks" onclick="setCat(this,'Drinks')">Drinks</button>
<button class="chip" data-cat="Places" onclick="setCat(this,'Places')">Places</button>
<button class="chip" data-cat="Experiences" onclick="setCat(this,'Experiences')">Experiences</button>
</div>

<section>
<div class="sectionhead">
<h2>What I tried lately</h2>
<span id="count" class="count"></span>
</div>
<div id="grid" class="grid"></div>
</section>
</div>

<nav class="bottom">
<button class="nav active" onclick="goHome()"><b>⌂</b>Home</button>
<button class="nav" onclick="focusSearch()"><b>⌕</b>Search</button>
<button class="nav" onclick="openModal()"><b>＋</b>Add</button>
<button class="nav" onclick="alert('Diary ekranını bir sonraki sürümde ekleyeceğiz.')"><b>▦</b>Diary</button>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
<div class="sheet">
<div class="grab"></div>
<h2>Yeni değerlendirme</h2>

<div class="row">
<label>Ne değerlendirdin?</label>
<input id="name" placeholder="Örn. CeraVe temizleyici">
</div>

<div class="row">
<label>Kategori</label>
<select id="cat">
<option>Beauty</option><option>Food</option><option>Drinks</option><option>Places</option><option>Experiences</option><option>Fashion</option><option>Home</option><option>Entertainment</option><option>Other</option>
</select>
</div>

<div class="row">
<label>Puanın — <strong id="scoreLabel">8</strong>/10</label>
<div class="score" id="scores"></div>
</div>

<div class="row">
<label>Tekrar?</label>
<div class="choices" id="choices">
<button data-v="Tekrar alırım" onclick="chooseAgain(this)">Tekrar alırım</button>
<button data-v="Belki" onclick="chooseAgain(this)">Belki</button>
<button data-v="Almam" onclick="chooseAgain(this)">Almam</button>
</div>
</div>

<div class="row">
<label>Kısa yorum</label>
<textarea id="note" placeholder="Neyi sevdin, neyi sevmedin?"></textarea>
</div>

<div class="row">
<label>Fotoğraf</label>
<input id="photo" type="file" accept="image/*" onchange="previewPhoto(event)">
<div id="photoPreview" class="photo-preview">
<img id="previewImg" alt="Fotoğraf önizleme">
</div>
<div id="photoNote" class="notehint">İstersen ürünün, yemeğin veya yerin fotoğrafını ekle.</div>
</div>

<div class="actions">
<button class="cancel" onclick="closeModal()">Vazgeç</button>
<button class="save" onclick="saveItem()">Kaydet</button>
</div>
</div>
</div>

<script>
const seed=[
{name:"Sky High Mascara",cat:"Beauty",score:8.5,again:"Tekrar alırım",note:"Günlük makyaj için çok iyi.",emoji:"💄"},
{name:"Çilekli cheesecake",cat:"Food",score:9,again:"Tekrar alırım",note:"Tam sevdiğim gibi.",emoji:"🍰"},
{name:"Iced latte",cat:"Drinks",score:7,again:"Belki",note:"Fena değil ama daha iyisini içtim.",emoji:"☕"},
{name:"Sevdiğim kafe",cat:"Places",score:8.5,again:"Tekrar alırım",note:"Ortamı çok güzel.",emoji:"📍"}
];

let items=JSON.parse(localStorage.getItem("mythings")||"null")||seed;
let currentCat="all",chosenScore=8,chosenAgain="Tekrar alırım",photoData="";

function render(){
const q=document.getElementById("search").value.toLowerCase();
let arr=items.filter(x=>(currentCat==="all"||x.cat===currentCat)&&(!q||x.name.toLowerCase().includes(q)));
document.getElementById("count").textContent=arr.length+(arr.length===1?" entry":" entries");
const grid=document.getElementById("grid");

grid.innerHTML=arr.length?arr.map((x,i)=>`
<article class="item ${i%3===0?'big':''}">
<div class="pic">
${x.photo?`<img src="${x.photo}" alt="">`:`<span class="emoji">${x.emoji||"✨"}</span>`}
<span class="scorepill">${x.score}/10</span>
</div>
<div class="body">
<div class="name">${esc(x.name)}</div>
<div class="meta">${esc(x.cat)}</div>
<div class="ratingrow">
<div class="rating">${x.score}/10</div>
<span class="again">${esc(x.again)}</span>
</div>
${x.note?`<div class="note">${esc(x.note)}</div>`:""}
</div>
</article>`).join(""):`<div class="empty">Henüz burada bir şey yok.<br><br><button class="chip" onclick="openModal()">＋ İlk değerlendirmeyi ekle</button></div>`;
}

function setCat(el,c){
currentCat=c;
document.querySelectorAll(".chip").forEach(b=>b.classList.remove("active"));
document.querySelector(`.chip[data-cat="${c}"]`)?.classList.add("active");
render();
}

function goHome(){
currentCat="all";
document.getElementById("search").value="";
document.querySelectorAll(".chip").forEach(b=>b.classList.remove("active"));
document.querySelector('.chip[data-cat="all"]').classList.add("active");
render();
window.scrollTo({top:0,behavior:'smooth'});
}

function focusSearch(){
document.getElementById("search").focus();
window.scrollTo({top:0,behavior:'smooth'});
}

function openModal(){
document.getElementById("modal").style.display="flex";
chosenScore=8;
chosenAgain="Tekrar alırım";
photoData="";
document.getElementById("name").value="";
document.getElementById("note").value="";
document.getElementById("photo").value="";
document.getElementById("cat").value="Beauty";
document.getElementById("photoNote").textContent="İstersen ürünün, yemeğin veya yerin fotoğrafını ekle.";
document.getElementById("photoPreview").style.display="none";
drawScores();
drawChoices();
}

function closeModal(){document.getElementById("modal").style.display="none"}

function drawScores(){
let s=document.getElementById("scores");
s.innerHTML="";
for(let i=0;i<=10;i++){
let b=document.createElement("button");
b.textContent=i;
b.className=i===chosenScore?"sel":"";
b.onclick=()=>{
chosenScore=i;
document.getElementById("scoreLabel").textContent=i;
drawScores();
};
s.appendChild(b);
}
document.getElementById("scoreLabel").textContent=chosenScore;
}

function chooseAgain(b){
chosenAgain=b.dataset.v;
drawChoices();
}

function drawChoices(){
document.querySelectorAll("#choices button").forEach(b=>b.classList.toggle("sel",b.dataset.v===chosenAgain));
}

function previewPhoto(e){
let f=e.target.files[0];
if(!f)return;
let r=new FileReader();
r.onload=()=>{
photoData=r.result;
document.getElementById("previewImg").src=photoData;
document.getElementById("photoPreview").style.display="block";
document.getElementById("photoNote").textContent="Fotoğraf hazır ✓";
};
r.readAsDataURL(f);
}

function saveItem(){
let name=document.getElementById("name").value.trim();
if(!name){
alert("Önce neyi değerlendirdiğini yaz.");
return;
}

let x={
name,
cat:document.getElementById("cat").value,
score:chosenScore,
again:chosenAgain,
note:document.getElementById("note").value.trim(),
photo:photoData,
emoji:"✨"
};

items.unshift(x);
localStorage.setItem("mythings",JSON.stringify(items));
closeModal();
render();
}

function esc(s){
return String(s).replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));
}

render();
</script>
</body>
</html>
